[package]
name = "usine-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "usine-cli"
path = "src/main.rs"

[features]
# The `usine-cli mcp` stdio relay onto the running app's socket.
default = ["mcp"]
mcp = ["usine-core/mcp", "tokio/net", "tokio/io-util", "tokio/io-std"]

[dependencies]
anyhow = "1.0.102"
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
usine-core = { path = "../core", default-features = false }
uuid.workspace = true
