[package]
name = "usine-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "usine"
path = "src/main.rs"

[dependencies]
arboard = "3.4.1"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dioxus = { version = "0.7.9", features = ["desktop"] }
futures.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde = "1.0.228"
serde_json = "1.0.150"
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
usine-core = { path = "../core" }
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# `setsid(2)` for the detached-launch re-exec (see `detach_from_terminal`).
libc = "0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSString"] }

[build-dependencies]
# Rasterize the single source `logo.svg` into the filled dock/taskbar icon PNG.
resvg = "0.47.0"
